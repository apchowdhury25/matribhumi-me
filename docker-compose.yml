services:
  db:
    image: postgres:16-alpine
    container_name: matribhumi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: matribhumi
      POSTGRES_PASSWORD: matribhumi
      POSTGRES_DB: matribhumi
    ports:
      - "5432:5432"
    volumes:
      - matribhumi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matribhumi"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://matribhumi:matribhumi@db:5432/matribhumi?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-matribhumi-dev-session-secret-change-me-32}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://matribhumi.me}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  matribhumi_pg:
